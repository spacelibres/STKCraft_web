worker_processes 1;
pid /run/stkcraft-geocalc-limiter/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /run/stkcraft-geocalc-limiter/body;
    proxy_temp_path /run/stkcraft-geocalc-limiter/proxy;
    fastcgi_temp_path /run/stkcraft-geocalc-limiter/fastcgi;
    uwsgi_temp_path /run/stkcraft-geocalc-limiter/uwsgi;
    scgi_temp_path /run/stkcraft-geocalc-limiter/scgi;
    limit_req_zone $binary_remote_addr zone=api_rate:1m rate=4r/s;
    limit_req_zone $server_name zone=global_rate:1m rate=8r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip:1m;
    limit_conn_zone $server_name zone=global:1m;
    limit_req_status 429;
    limit_conn_status 429;
    server {
        listen 127.0.0.1:3101;
        server_name geocalc.stkcraft.com;
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Geocalc-Client-IP;
        client_max_body_size 64k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Host geocalc.stkcraft.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 2 always;
            add_header Cache-Control no-store always;
            return 429 '{"error":"Too many active requests. Please pause playback and try again shortly."}';
        }
        location = /favicon.ico {
            return 302 https://www.stkcraft.com/app-icon-512.png;
        }
        location /api/ {
            limit_req zone=api_rate burst=8 nodelay;
            limit_req zone=global_rate burst=12 nodelay;
            limit_conn per_ip 6;
            limit_conn global 8;
            add_header Cache-Control no-store always;
            proxy_pass http://127.0.0.1:3100;
        }
        location / { proxy_pass http://127.0.0.1:3100; }
    }
}
